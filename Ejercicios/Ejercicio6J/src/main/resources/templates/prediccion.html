<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Predicción AEMET</title>
    <style>
        table { border-collapse: collapse; width: 100%; text-align: center; }
        th, td { border: 1px solid #ccc; padding: 10px; }
        .verde { color: green; font-weight: bold; }
        .naranja { color: orange; font-weight: bold; }
        .rojo { color: red; font-weight: bold; }
    </style>
</head>
<body>
<h2>Predicción Meteorológica</h2>
<table>
    <thead>
    <tr>
        <th th:each="p : ${semana}"
            th:text="${#temporals.format(p.fecha, 'dd/MM')}">
        </th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td th:each="p : ${semana}">
            <img th:src="${p.urlImagen}" width="40"/><br>
            <span th:text="${p.probabilidadPrecipitacion} + '%'"></span>
        </td>
    </tr>
    <tr>
        <td th:each="p : ${semana}">
            <span th:text="${p.tempMax}"></span>° /
            <span th:text="${p.tempMin}"></span>°
        </td>
    </tr>
    <tr>
        <td th:each="p : ${semana}">
            UV:
            <span th:text="${p.nivelUV}"
                  th:classappend="${p.nivelUV <= 1} ? 'verde' : (${p.nivelUV <= 3} ? 'naranja' : 'rojo')">
            </span>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
